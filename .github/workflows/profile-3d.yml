name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate the 3D contribution graph
    steps:
      - name: Checkout the profile repository
        uses: actions/checkout@v4

      - name: Checkout snk-rs
        uses: actions/checkout@v4
        with:
          repository: junhinhow/snk-rs
          path: snk-rs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: snk-rs-3d

      - name: Build snk-rs
        run: cargo install --path snk-rs --locked

      - name: Generate the 3D profile
        run: |
          mkdir -p profile-3d-contrib
          snk-rs --user junhinhow --format 3d --style night-green \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --output profile-3d-contrib/profile-night-green.svg
          snk-rs --user junhinhow --format 3d --style green \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --output profile-3d-contrib/profile-green-animate.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "the 3D profile did not change"
          else
            git commit -m "chore: regenerate the 3D contribution graph"
            git push
          fi
